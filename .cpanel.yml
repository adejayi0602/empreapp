---
deployment:
  tasks:
    - export DEPLOYPATH=/home/qrtbhscacw/empretechnologies.com.ng
    - /bin/mkdir -p $DEPLOYPATH
    # Website code only (build tools, README and git files are not copied)
    - /bin/cp -R admin assets inc lib $DEPLOYPATH
    - /bin/cp *.php .htaccess robots.txt $DEPLOYPATH
    # data/ holds the live database and uploaded CVs: never overwritten
    - /bin/mkdir -p $DEPLOYPATH/data
    - /bin/cp -n data/.htaccess data/index.html $DEPLOYPATH/data/
